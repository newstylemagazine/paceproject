<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="trace-icon.svg" />
    <title>Your reflection · Trace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page about-page">
      <nav class="hero-nav">
        <a href="index.html" class="wordmark" aria-label="Trace home"><img src="trace-mark.svg" alt="" class="wordmark-mark" width="48" height="35" />Trace</a>
        <div class="nav-links">
          <a href="index.html" class="nav-link">Write</a>
          <a href="search.html" class="nav-link">Browse the archive</a>
        </div>
      </nav>

      <header class="hero">
        <div class="about-headline-row">
          <h1 id="headline">Your reflection</h1>
        </div>
        <p id="intro" class="subtitle"></p>
        <p id="statusLine" class="status-line"></p>
        <div class="about-actions">
          <a href="index.html" class="transcript-link">Keep writing</a>
          <a href="search.html" class="transcript-link">Browse the archive</a>
          <button id="regenerateButton" type="button" class="transcript-link regenerate-button" hidden>Regenerate</button>
        </div>
      </header>

      <section class="about-grid">
        <article class="result-card about-span-all">
          <h2>Threads worth pulling on</h2>
          <ul id="threadList"></ul>
        </article>

        <article class="result-card about-span-all">
          <h2>Documents and artifacts</h2>
          <div id="uploadGallery" class="upload-gallery"></div>
        </article>

        <article class="result-card about-span-all">
          <h2>Voices who've stood near where you're standing</h2>
          <div id="recommendationList" class="recommendation-list"></div>
        </article>

        <article class="result-card about-span-all provocation-card">
          <p class="provocation-label">One more thing</p>
          <p id="provocation" class="provocation-text"></p>
        </article>
      </section>
    </main>

    <script src="about-me.js"></script>
  </body>
</html>
